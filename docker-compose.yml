services:
  app:
    build: .
    container_name: nas-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Point the app at the bundled Redis service for rate limiting
      - REDIS_URL=redis://redis:6379/0
      # Uncomment to use the bundled PostgreSQL service instead of SQLite:
      # - DATABASE_URL=postgresql://nas_admin:change_me@postgres:5432/nas_database
    volumes:
      - ./files:/app/files
      - ./instance:/app/instance
      - ./logs:/app/logs
    depends_on:
      - redis
      # - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nas-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Optional PostgreSQL — uncomment this block and the DATABASE_URL/ depends_on
  # lines above to run a production database instead of SQLite.
  # postgres:
  #   image: postgres:15
  #   container_name: nas-postgres
  #   environment:
  #     - POSTGRES_USER=nas_admin
  #     - POSTGRES_PASSWORD=change_me
  #     - POSTGRES_DB=nas_database
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  redis-data:
  # postgres-data:
